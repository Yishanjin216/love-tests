<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>恋爱心理测试</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FDF7F3 0%,#F5EAF1 55%,#EFE4F2 100%);
  min-height:100vh;color:#3A3230;
  display:flex;align-items:center;justify-content:center;
  padding:32px 18px;
}
#app{width:100%;max-width:400px;}
.kicker{font-size:11px;letter-spacing:3px;color:#B79AA6;text-align:center;margin-bottom:16px;}
h1{
  font-family:"Songti SC",Georgia,serif;font-size:27px;line-height:1.55;
  margin:0 0 12px;font-weight:600;color:#443840;text-align:center;
}
.sub{font-size:12.5px;color:#8E7A84;line-height:1.9;text-align:center;margin:0 0 34px;}

a.entry{
  display:block;text-decoration:none;position:relative;overflow:hidden;
  border-radius:22px;padding:26px 24px;margin-bottom:16px;color:#fff;
  box-shadow:0 12px 28px rgba(120,90,110,.20);
  transition:transform .16s ease;
}
a.entry:active{transform:scale(.985)}
a.entry:after{
  content:"";position:absolute;left:-20%;right:-20%;top:-60px;height:150px;
  background:rgba(255,255,255,.13);transform:rotate(-7deg);
}
.e1{background:linear-gradient(145deg,#A98BD0,#7E63A8);}
.e2{background:linear-gradient(145deg,#6E93BC,#42658C);}
a.entry .tag{position:relative;font-size:11px;letter-spacing:2px;opacity:.85;margin-bottom:10px;}
a.entry .name{position:relative;font-family:"Songti SC",Georgia,serif;font-size:23px;font-weight:600;letter-spacing:1px;line-height:1.45;margin-bottom:10px;}
a.entry .desc{position:relative;font-size:12.5px;line-height:1.85;opacity:.92;margin-bottom:16px;}
a.entry .go{position:relative;font-size:12.5px;letter-spacing:1px;opacity:.95;}
a.entry .go:after{content:" →";}

.foot{font-size:11px;color:#B3A6BE;text-align:center;margin-top:26px;letter-spacing:.5px;line-height:1.9;}
</style>
</head>
<body>
<div id="app">
  <div class="kicker">LOVE &amp; SELF</div>
  <h1>恋爱心理测试</h1>
  <p class="sub">两道题，两个角度。<br>看看你在关系里，究竟是什么样子。</p>

  <a class="entry e1" href="./persona/">
    <div class="tag">TEST 01</div>
    <div class="name">你在感情里的隐藏人格</div>
    <div class="desc">你没说出口的那部分，其实一直在替你做选择。</div>
    <div class="go">开始测试</div>
  </a>

  <a class="entry e2" href="./position/">
    <div class="tag">TEST 02</div>
    <div class="name">测测你在恋爱关系中占什么地位</div>
    <div class="desc">你以为你在的位置，和你实际站的位置，常常不是同一个。</div>
    <div class="go">开始测试</div>
  </a>

  <div class="foot">结果仅供参考，也供你想一想自己。</div>
</div>
</body>
</html>
