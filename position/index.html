<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FBF6FF 0%,#F4EBF7 55%,#EFE6F4 100%);

  display:flex;align-items:center;justify-content:center;
  padding:24px 18px;
}
#app{width:100%;max-width:400px;}
.screen{display:none;animation:fade .35s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.cover{text-align:center;padding:36px 8px 24px;}
.cover .kicker{font-size:12px;letter-spacing:3px;color:#AE9BC0;margin-bottom:18px;}
.cover h1{font-family:"Songti SC",Georgia,serif;font-size:29px;line-height:1.5;margin:0 0 14px;font-weight:600;color:#41364A;}
.cover p{font-size:13px;color:#8B7C96;line-height:1.9;margin:0 0 32px;}

.btn{
  display:block;width:100%;border:none;border-radius:999px;
  padding:16px;font-size:16px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,#A98BD0,#7E63A8);
  box-shadow:0 8px 20px rgba(126,99,168,.28);
  cursor:pointer;font-family:inherit;transition:transform .15s ease;
}
.btn:active{transform:scale(.97)}
.meta{margin-top:14px;font-size:11px;color:#B3A6BE;letter-spacing:.5px;}

.q-head{display:flex;justify-content:space-between;font-size:12px;color:#A798B2;margin-bottom:10px;}
.bar{height:4px;background:#EDE4F2;border-radius:99px;overflow:hidden;margin-bottom:34px;}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#BB9BDD,#7E63A8);border-radius:99px;transition:width .3s ease;}
.q-text{font-family:"Songti SC",Georgia,serif;font-size:21px;line-height:1.65;margin:0 0 30px;color:#3E344A;}
.opt{
  display:block;width:100%;text-align:left;border:1px solid #E9DFF0;background:#fff;
  border-radius:18px;padding:18px 20px;font-size:15px;line-height:1.6;color:#463C50;
  margin-bottom:14px;cursor:pointer;font-family:inherit;
  box-shadow:0 2px 10px rgba(160,140,180,.07);transition:all .16s ease;
}
.opt:active{transform:scale(.985);border-color:#CDB6E2;background:#FCFAFF;}

.card{
  border-radius:24px;padding:32px 26px 26px;color:#fff;
  box-shadow:0 14px 34px rgba(100,80,120,.22);
  position:relative;overflow:hidden;
  min-height:560px;display:flex;flex-direction:column;
}
.card:before{content:"";position:absolute;left:-20%;right:-20%;top:-70px;height:180px;background:rgba(255,255,255,.13);transform:rotate(-7deg);}
.card .badge{
  display:inline-block;font-size:11px;letter-spacing:2px;padding:5px 12px;
  border:1px solid rgba(255,255,255,.5);border-radius:99px;margin-bottom:18px;
  position:relative;opacity:.95;
}
.card .icon{font-size:32px;margin-bottom:12px;position:relative;}
.card .tname{font-family:"Songti SC",Georgia,serif;font-size:29px;font-weight:600;letter-spacing:2px;margin:0 0 8px;position:relative;}
.card .tag{font-size:13px;opacity:.9;letter-spacing:1px;margin-bottom:20px;position:relative;}
.card .core{font-size:14px;line-height:1.95;opacity:.96;padding:15px 0;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);margin-bottom:18px;position:relative;}
.card .traits{list-style:none;padding:0;margin:0 0 20px;position:relative;}
.card .traits li{font-size:13.5px;line-height:2.05;opacity:.95;}
.card .traits li:before{content:"·";margin-right:10px;opacity:.7;}
.card .need{font-size:13.5px;line-height:1.9;opacity:.96;position:relative;margin-top:auto;}
.card .need b{font-weight:600;}
.card .wm{position:absolute;right:24px;bottom:18px;font-size:10px;opacity:.55;letter-spacing:1px;}

.hint{font-size:11.5px;color:#A798B2;text-align:center;margin:14px 0 22px;letter-spacing:.5px;}
.report{background:#fff;border-radius:20px;padding:8px 22px 22px;box-shadow:0 6px 22px rgba(160,140,180,.10);}
.rp-head{
  font-family:"Songti SC",Georgia,serif;font-size:15px;color:#41364A;font-weight:600;
  padding:18px 0 4px;letter-spacing:1px;
}
.rp-block{padding:16px 0;border-top:1px solid #F1EAF5;}
.rp-block:first-of-type{border-top:none;}
.rp-block h4{margin:0 0 9px;font-size:13px;color:#7E63A8;font-weight:600;letter-spacing:.5px;}
.rp-block p{margin:0;font-size:13.5px;line-height:2;color:#5A5063;}
.rp-block ul{list-style:none;padding:0;margin:0;}
.rp-block li{font-size:13.5px;line-height:2;color:#5A5063;padding-left:16px;position:relative;}
.rp-block li:before{content:"·";position:absolute;left:2px;color:#B79BD8;}
.ghost{display:block;width:100%;text-align:center;background:none;border:none;color:#A798B2;font-size:13px;padding:22px 0 0;cursor:pointer;font-family:inherit;}
.toast{
  position:fixed;left:50%;bottom:40px;transform:translate(-50%,16px);
  background:rgba(58,50,48,.92);color:#fff;font-size:13px;line-height:1.6;
  padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;
  transition:all .25s ease;max-width:80vw;text-align:center;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div id="app">

  <section id="s-cover" class="screen active">
    <div class="cover">
      <div class="kicker">RELATIONSHIP POSITION</div>
      <h1>测测你在恋爱关系中<br>占什么地位</h1>
      <p>你以为你在的位置，<br>和你实际站的位置，<br>常常不是同一个。</p>
      <button class="btn" id="start">开始测试</button>
      <div class="meta">12 题 · 约 1 分钟 · 12 种结果</div>
    </div>
  </section>

  <section id="s-q" class="screen">
    <div class="q-head"><span id="q-idx">01 / 12</span><span>凭直觉选</span></div>
    <div class="bar"><span id="q-bar"></span></div>
    <h2 class="q-text" id="q-text"></h2>
    <div id="q-opts"></div>
  </section>

  <section id="s-result" class="screen">
    <div class="card" id="card">
      <div class="badge" id="r-badge"></div>
      <div class="icon" id="r-icon"></div>
      <h2 class="tname" id="r-name"></h2>
      <div class="tag" id="r-tag"></div>
      <div class="core" id="r-core"></div>
      <ul class="traits" id="r-traits"></ul>
      <div class="need" id="r-need"></div>
      <div class="wm">恋爱地位测试</div>
    </div>
    <div class="hint">截图保存，它就是你的结果卡</div>

    <div class="report">
      <div class="rp-head">完整报告</div>

      <div class="rp-block">
        <h4>为什么你会站在这个位置</h4>
        <p id="rp-why"></p>
      </div>

      <div class="rp-block">
        <h4>你的 3 个惯性动作</h4>
        <ul id="rp-signals"></ul>
      </div>

      <div class="rp-block">
        <h4>想往上走一步</h4>
        <ul id="rp-move"></ul>
      </div>

      <div class="rp-block">
        <h4>什么样的关系最适合你</h4>
        <p id="rp-fit"></p>
      </div>
    </div>

    <button class="ghost" id="again">重新测一次</button>
  </section>

</div>
<div class="toast" id="toast"></div>

    why:'你们各自完整，只是顺路走一段很长的路。你不索取也不依附，这让你很轻松，也让关系少了点浓度。',

    move:['偶尔示弱一次，让他有机会照顾你','把藏着的期待说出来','给关系一次变深的机会'],
    fit:'适合你的是一个也有自己的世界、但愿意偶尔走进来的人。'},

  low_zhi:{
    why:'你什么都看得清，就是不说破。你比谁都明白这段关系的底细，可你选择按兵不动——因为你怕说破了就真的没了。清醒有时候是最累的处境。',
    signals:['看得透，但忍住不说','怕一开口就失去','一直在等他先动'],
    move:['挑一件小事，把真实感受说出来试试','承认自己的需求不是过分','允许关系承受一次真话'],
    fit:'适合你的是一个值得你把话说开的人——如果他听完就走，那你本来也留不住他。'},
  low_huo:{
    why:'你爱的方式是把整颗心先推过去。你不计算、不留退路，总先把最好的给出去。你怕的不是付出，是付出之后没人接。',
    signals:['毫不保留，先给再说','情绪都写在脸上','越好，越容易被当成理所当然'],
    move:['付出之前先问自己一句「我愿意吗」','把你的需要说出来，而不是等他发现','留一点给自己'],
    fit:'适合你的是一个会把你的好记在心里、并且当面说出来的的人。'},
  low_shui:{
    why:'你总是在等、在接、在原谅。你的温柔撑住了这段关系，却常常撑不住自己。别人在你这里充电，你的电却没人充。',
    signals:['几乎不拒绝','委屈自己消化','一退再退，退到快没有底线'],
    move:['练习说「这次我不行」','把底线写下来，然后说出口','接受「让他暂时失望」是安全的'],
    fit:'适合你的是一个懂得反过来照顾你的人——关系不该只有你在撑。'},
  low_feng:{
    why:'你用疏离保护自己。遇事先把心收回来，看起来不在乎，其实在意得很。你不是不想靠近，是怕靠近之后被丢下。',
    signals:['不主动，也不追问','用冷淡掩饰在意','一旦确认被爱，会非常深'],
    move:['主动一次，看看会怎么样','把「其实我在等你」说出口','把沉默换成一句真话'],
    fit:'适合你的是一个有耐心、会主动来找你的人——他多走一步，你才敢上前。'}
};

let idx = 0;
let score = 0;
let styles = {zhi:0,huo:0,shui:0,feng:0};

const $ = (id) => document.getElementById(id);
const show = (id) => {
  ['s-cover','s-q','s-result'].forEach(s => $(s).classList.toggle('active', s === id));
};
const toast = (msg) => {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2200);
};

function reset(){
  idx = 0; score = 0;
  styles = {zhi:0,huo:0,shui:0,feng:0};
}

function renderQ(){
  const item = QUESTIONS[idx];
  $('q-idx').textContent = String(idx+1).padStart(2,'0') + ' / ' + QUESTIONS.length;
  $('q-bar').style.width = (idx/QUESTIONS.length*100) + '%';
  $('q-text').textContent = item.q;
  const box = $('q-opts');
  box.innerHTML = '';
  [item.a, item.b].forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = opt.t;
    b.addEventListener('click', () => choose(opt));
    box.appendChild(b);
  });
}

function choose(opt){
  score += opt.p;
  styles[opt.k] += 1;
  idx += 1;
  if (idx >= QUESTIONS.length) finish();
  else renderQ();
}

function tierOf(s){
  if (s >= 8) return 'high';
  if (s <= 4) return 'low';
  return 'mid';
}

function styleOf(c){
  let best = STYLE_ORDER[0];
  for (const k of STYLE_ORDER) if (c[k] > c[best]) best = k;
  return best;
}

function finish(){
  const key = tierOf(score) + '_' + styleOf(styles);
  const t = TYPES[key] || TYPES.mid_shui;
  $('card').style.background = t.bg;
  $('r-badge').textContent = t.tier;
  $('r-icon').textContent = t.icon;
  $('r-name').textContent = t.name;
  $('r-tag').textContent = t.tag;
  $('r-core').textContent = t.core;
  const ul = $('r-traits');
  ul.innerHTML = '';
  t.traits.forEach(x => {
    const li = document.createElement('li');
    li.textContent = x;
    ul.appendChild(li);
  });
  $('r-need').innerHTML = t.need;

  const rp = REPORTS[key] || REPORTS.mid_shui;
  $('rp-why').textContent = rp.why;
  $('rp-fit').textContent = rp.fit;
  const list = (el, arr) => {
    el.innerHTML = '';
    arr.forEach(x => {
      const li = document.createElement('li');
      li.textContent = x;
      el.appendChild(li);
    });
  };
  list($('rp-signals'), rp.signals);
  list($('rp-move'), rp.move);

  show('s-result');
  window.scrollTo(0, 0);
}

$('start').addEventListener('click', () => { reset(); renderQ(); show('s-q'); });
$('again').addEventListener('click', () => { reset(); show('s-cover'); window.scrollTo(0, 0); });
</script>
</body>
